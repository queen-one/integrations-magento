services:
  app:
    volumes:
      - type: bind
        source: ${QUEEN_ONE_MODULE_PATH}
        target: /var/www/html/app/code/QueenOne/Connect
        consistency: cached
      - type: volume
        source: queen_one_module_local_mask
        target: /var/www/html/app/code/QueenOne/Connect/.local
        volume:
          nocopy: true

  phpfpm:
    volumes:
      - type: bind
        source: ${QUEEN_ONE_MODULE_PATH}
        target: /var/www/html/app/code/QueenOne/Connect
        consistency: cached
      - type: volume
        source: queen_one_module_local_mask
        target: /var/www/html/app/code/QueenOne/Connect/.local
        volume:
          nocopy: true

  phpfpm-xdebug:
    volumes:
      - type: bind
        source: ${QUEEN_ONE_MODULE_PATH}
        target: /var/www/html/app/code/QueenOne/Connect
        consistency: cached
      - type: volume
        source: queen_one_module_local_mask
        target: /var/www/html/app/code/QueenOne/Connect/.local
        volume:
          nocopy: true

volumes:
  queen_one_module_local_mask:
